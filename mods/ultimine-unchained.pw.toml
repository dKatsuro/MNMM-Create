name = "Ultimine Unchained"
filename = "ultimineunchained-1.2.0-1.21.1-NEOFORGE.jar"
# Both sides, overriding packwiz's inference. Modrinth marks this client_side =
# unsupported, so packwiz picked side = "server" -- but the manifest declares
# every dependency side = "BOTH", and UltimineMixin sits in the common "mixins"
# array (not "client"), so it applies to the integrated server too. Left as
# server-only it would simply not be installed on the client and would silently
# do nothing in singleplayer.
#
# Note the Modrinth "neoforge" tag also carries a Fabric-only jar; the correct
# artifact is the -NEOFORGE one above (the other has no neoforge.mods.toml).
side = "both"

