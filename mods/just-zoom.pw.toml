# Client-only: Modrinth lists server_side = unsupported and it only adjusts the
# client FOV. Hotkey to zoom, mouse wheel to change the zoom factor.
#
# Chosen over Ok Zoomer and WI Zoom for two concrete reasons. Its only
# dependency is konkrete [1.9.0,) and we already ship Konkrete 1.9.9, so it adds
# nothing new to the pack -- same author as our FancyMenu, Konkrete, Drippy
# Loading Screen and Melody. And 2.1.0 is a stable release, where Ok Zoomer's
# 1.21.1 line is still on 10.0.0-beta.
#
# neoforge [21.1.47,) and minecraft [1.21.1,); we are on 21.1.234.
side = "client"

