name = "Just Enough Items (JEI)"
filename = "jei-1.21.1-neoforge-19.39.0.372.jar"
# Client-only, as the pack shipped it before the EMI swap. JEI is NOT here as a
# recipe viewer -- EMI hides its overlay automatically. It is here purely so that
# EMI's built-in JEMI bridge (dev/emi/emi/jemi/, plus a @Pseudo mixin on
# mezz.jei.library.load.PluginCaller) has a JEI API to read. Create ships only a
# JEI plugin (com.simibubi.create.compat.jei.CreateJEI) and no EMI plugin, so
# without this jar every Create and Create-addon recipe is invisible in EMI.
#
# PINNED -- do not run `packwiz update jei`. Every JEI build from 19.42.0.379
# onward requires neoforge [21.1.238,) and this pack is on 21.1.233, so they
# hard-fail at load. 19.39.0.372 is the newest build still on [21.0.118-beta,).
# Bumping JEI therefore requires bumping pack.toml's neoforge version first.
#
# Do not add TooManyRecipeViewers alongside this -- TMRV declares JEI incompatible.
side = "client"

