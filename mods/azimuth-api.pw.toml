# Both sides. Library by the Bits 'n' Bobs author that extends Create's systems.
# Its mixins are overwhelmingly common-side Create internals -- RotationPropagator,
# SmartBlockEntity, StructureTransform, ItemRequirement, LevelChunk, plus a
# Registrate OTER fix -- with only three client entries, so it has to load
# wherever Bits 'n' Bobs does.
#
# Added as a hard dependency of Create: Bits 'n' Bobs 2.2.9 (azimuth [1.4.6,)).
# Self-contained: the manifest asks only for neoforge [21.1.219,) and minecraft
# [1.21.1]. Ships azimuth.mixins.json with overwrites.requireAnnotations = true.
side = "both"

