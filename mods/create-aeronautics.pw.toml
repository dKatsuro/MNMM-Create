name = "Create Aeronautics"
filename = "create-aeronautics-bundled-1.21.1-1.3.2.jar"
# Both sides. The pack's centrepiece. This is the "bundled" distribution: the
# jar is a thin wrapper whose META-INF/jarjar ships three mods versioned in
# lockstep with it -- aeronautics, offroad and simulated. Sable is NOT bundled
# and is tracked separately in sable.pw.toml.
#
# NOT pinned, deliberately. It carried pin = true from dd10b2f until 2.1.0, but
# that was a leftover: dd10b2f pinned Create and Create Aeronautics together
# while adding other mods, and b3bf742 ("clean upstream leftovers") removed
# Create's pin and missed this one. No dependency required it. Verified before
# unpinning -- every dependent takes 1.3.2: aeroworks simulated [1.3.0,),
# clientcrafting and climbable_ropes [1.3.0,1.4.0), createaeronauticscurios
# aeronautics/simulated "*". Nothing declares aeronautics_bundled at all.
#
# neoforge [21.1.228,) and minecraft [1.21.1].
side = "both"

