name = "Dyenamics"
filename = "dyenamics-1.21.1-3.4.2.jar"
# Both sides. 18 new dye colours, each with its own wool, glass, terracotta,
# concrete, bed, shulker box, banner and sheep variants.
#
# Chosen over Dye Depot specifically for what it does NOT do. Dye Depot's
# DyeColorMixin appends its colours to the vanilla DyeColor enum in the class
# initialiser, so every mod that registers blocks by looping DyeColor.values()
# silently gained 16 variants with no models. Measured in a test client that took
# the pack from 78 distinct missing models to 750, across 20 mods, and Dye The
# World only clawed it back to 572. Dyenamics instead defines its own type,
# cy.jdkdigital.dyenamics.core.util.DyenamicDyeColor, and registers its blocks in
# its own namespace -- nothing else in the pack sees a new DyeColor, so nothing
# else breaks. The deliberate trade is that vanilla and Create dyeable blocks do
# not accept these colours directly; see dyenamicsandfriends.pw.toml, which
# recovers most of that through tags.
#
# Its only mixins are MixinCat, MixinWolf and three client collar/decor layers.
# Nothing touching registries, models or block entities.
#
# CurseForge-only -- not published on Modrinth for 1.21.1.
#
# The manifest declares minecraft [1.21,1.21.1), which reads as excluding our
# 1.21.1. It does not, in practice: Explorer's Compass, Nature's Compass and Iris
# are all in this pack, all declare that identical range, and all load fine on
# 1.21.1. Also neoforge [21.1.0,), and it ships an access transformer.
side = "both"

