# Both sides. Modern light panels placeable on any face and underwater, with a
# channel system (shift-click to assign 0-8), wall switches and light sensors --
# all server-side state, so the server needs the jar.
#
# NOTE: this is the smaller "Night Lights" (Modrinth rGzJrU0n). Ninni's far more
# popular Night Lights (s7pMb898, ~843k downloads) declares the SAME modId
# "nightlights", so the two are mutually exclusive. Do not add the other one.
#
# neoforge [21.1.128,) and minecraft [1.21.1,1.22). No hard mod dependencies;
# jade is an optional CLIENT dep and is in the pack, theoneprobe is not.
side = "both"

