name = "Create: Bits 'n' Bobs"
filename = "bits_n_bobs-2.2.9.jar"
# Both sides -- decorative and mechanical Create additions, all registry content.
#
# Updated 0.0.44 -> 2.2.9. That jump added two hard dependencies, both brought in
# alongside it: azimuth [1.4.6,) (azimuth-api.pw.toml) and struts [1.0.0,)
# (strut-your-stuff.pw.toml). It also raised the floors to create [6.0.10,) and
# neoforge [21.1.219,); we are on Create 6.0.10 exactly and NeoForge 21.1.234.
#
# WORLD NOTE: 2.2.9 dropped four block ids that 0.0.44 had -- small_cogwheel_chain,
# large_cogwheel_chain and their _flanged_ variants -- consolidated into
# cogwheel_chain_carriage plus a chain pulley. Any placed under 0.0.44 are lost on
# load. 29 blocks added; the only item removed is icon_lightbulb, a GUI icon.
#
# tfmg is declared incompatible for (,1.2.2] and TFMG is not in this pack. All
# three optional integrations ARE live: createcasing (Create Encased), dndecor
# (Design n' Decor) and create_connected are all installed, so every compat.*
# entry in bits_n_bobs.mixins.json loads rather than being gated off by
# BnbMixinPlugin.
#
# Mixin surface is large: 39 common + 21 client, deep into Create internals
# (KineticBlockEntity, RotationPropagator, ContraptionCollider, BeltBlock,
# MechanicalPistonBlock, PistonExtensionPole, fluid pipes and tanks). 0.0.44 had
# 10 + 5. Suspect this first if Create behaviour goes strange.
side = "both"

