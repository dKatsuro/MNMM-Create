name = "Artifacts"
filename = "artifacts-neoforge-13.2.3.jar"
# Both sides. Artifacts' effects (attribute modifiers, damage hooks, mob
# interactions) run server-side and it ships both mixins.artifacts.common.json
# and mixins.artifacts.neoforge.json.
#
# PINNED to 13.2.3 -- deliberately older than the current 13.2.5. Reliquified
# Artifacts 1.0.8 declares artifacts with versionRange = "[13.2.3]", a Maven
# single-version range rather than a floor, so any other Artifacts build
# hard-fails that mod at load. Do not run `packwiz update artifacts`; bump it
# only in lockstep with a Reliquified Artifacts release that widens the range.
#
# The manifest declares no mod dependencies at all -- only neoforge
# [21.0.133-beta,) and minecraft 1.21.1. Curios is a soft integration
# (artifacts/neoforge/integration/curios/*, data/artifacts/curios/slots/*) picked
# up at runtime because Curios is in the pack; there is a parallel Accessories
# integration that stays dormant.
side = "both"

