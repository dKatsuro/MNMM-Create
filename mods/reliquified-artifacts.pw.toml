# either. Also relics [0.12.3,) (we ship 0.12.8), octolib [0.6,) (0.6.2), curios
# [9.3.1+1.21,) (9.5.1), neoforge [21.0.140-beta,) and minecraft [1.21,1.22).
# Ships reliquified_artifacts.mixins.json.
