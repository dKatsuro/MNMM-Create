# Both sides: manifest dependencies are all side = "BOTH" and the terminal
# performs real inventory moves.
#
# Tightest floor in the pack: create [6.0.10,6.1.0) against our Create 6.0.10
# exactly, so ANY Create downgrade hard-fails this. Also neoforge [21.1.222,)
# against our 21.1.234.
#
# New and small -- 0.1.1 is the only published build. Overlaps in purpose with
# Create Contraption Terminals, but they are different mods by different
# authors: that one is the Tom's Storage addon aimed at contraptions and trains,
# this one is standalone and attaches to vaults and modded storage blocks.
side = "both"

