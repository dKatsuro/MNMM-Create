name = "FTB Ultimine (NeoForge)"
filename = "ftb-ultimine-neoforge-2101.1.15.jar"
# Both sides: every dependency in the manifest is side = "BOTH", and the server
# has to perform the multi-block break. CurseForge-sourced because FTB Ultimine
# has no Modrinth project at all -- the `ultimine` slug there is an unrelated
# project (2 versions, loader "minecraft"), not this mod. This matches how the
# pack already sources ftb-library / ftb-quests / ftb-teams.
#
# Requires ftblibrary [2101.1.28,) -- we are on 2101.1.33, so do not downgrade
# FTB Library. ftbezcrystals is declared optional and is not installed.
# Keep at 2101.1.15 or newer: Create Ultimine requires ftbultimine [2101.1.14,).
side = "both"

