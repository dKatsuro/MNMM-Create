name = "BlueMap"
filename = "bluemap-5.7-neoforge.jar"
# Server-only, and not by choice: Modrinth publishes this build as
# environment = dedicated_server_only / client_side = unsupported. BlueMap
# renders the web map by reading the server's own region files, so a client
# install has nothing to run.
#
# PINNED, and this is a hard ceiling -- do not run `packwiz update bluemap`.
# The 5.7 release notes state: bluemap-5.7-neoforge.jar | NeoForge 1.21 - 1.21.5.
# 5.8-neoforge moved to 1.21.6 and every later NeoForge build tracks the current
# MC line (5.14+ is 1.21.11, 5.17+ is 26.1), so 5.7 is the last jar that will
# load on this pack. Same class of pin as JEI. Only the CLI build is
# version-flexible; the mod builds link against a specific MC.
#
# Targets Java 21 and BlueMapAPI 2.7.4. The Create rendering addons are matched
# to that API version and are installed outside packwiz -- see
# config/bluemap/packs/README.md. BlueMapModelLoaders is the exception: on
# 5.7-5.9 it loads as a mod, so it lives in mods/ alongside this.
#
# Config lives at config/bluemap/ (ForgeMod.getConfigFolder). That whole tree is
# packwizignored and managed on the VPS, so it is never shipped to clients.
side = "server"

[download]
url = "https://cdn.modrinth.com/data/swbUV1cr/versions/8iJcPOHJ/bluemap-5.7-neoforge.jar"
hash-format = "sha512"
