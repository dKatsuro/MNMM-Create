name = "Create Deco"
filename = "createdeco-2.1.3.jar"
# Both sides: all manifest dependencies are side = "BOTH"; it is a block and
# item content mod.
#
# Two bounds worth knowing:
#   neoforge [21.1.209,)    -- we are on 21.1.234.
#   create   [6.0.7,6.1.0)  -- the upper bound is exclusive, so bumping Create to
#                              6.1 will hard-fail this mod at load.
#
# Not to be confused with "Create: Design n' Decor" (create-design-n-decor),
# which the pack already ships -- different author, different block set.
side = "both"

