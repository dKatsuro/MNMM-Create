name = "Create: Copycats + Additions"
filename = "copycats-plus-additions-1.3.2-neo.jar"
# Both sides. Registers real blocks, block entities and items
# (registry/ModBlocks, ModBlockEntities, ModItems) plus a ServerConfig, so the
# server needs it to place and save these blocks at all; the client half is only
# the model cores under client/ that bake the mimicked texture onto the new
# shapes.
#
# copycats [3.0.4,3.0.9) -- exclusive upper bound. We are on Copycats+ 3.0.4,
# which is also the floor: bumping Copycats+ past 3.0.8 breaks this mod.
# create [0,) (unbounded), neoforge [21.1.230,) -- we are on 21.1.234, so a
# NeoForge downgrade below .230 would break it.
#
# Two optional deps, neither shipped as a hard requirement:
#   sable [2.0.3,3.0) (CLIENT) -- we have Sable 2.0.3 exactly, so the client
#     re-mesh hook for copycats on Sable sub-levels is live; it is at the very
#     bottom of the range, so a Sable downgrade silently drops the compat.
#   sable_beyond [0.5.0,0.6.0) -- not in this pack; the mass-reflection compat
#     under compat/sable/SableBeyond* stays dormant.
#
# Ships no mixins.
side = "both"

