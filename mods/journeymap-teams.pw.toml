# Both sides. It ships a matching pair of plugins for each backend --
# VanillaTeamsServerPlugin reads team membership on the server while
# VanillaTeamsClientPlugin colours the radar entries on the client -- so it only
# does anything with the jar installed on both.
#
# journeymap [1.21.1-6.0.0,) ordered AFTER (we ship 1.21.1-6.0.7), neoforge [4,)
# and minecraft [1.21.1,1.22). It also carries FTB Teams handlers
# (FtbTeamsServerPlugin / FtbTeamsClientPlugin) as an undeclared soft
# integration; FTB Teams is in this pack, so that path is live as well as the
# vanilla scoreboard one.
side = "both"

