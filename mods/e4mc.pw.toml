name = "e4mc"
filename = "e4mc-neoforge-6.2.1.jar"
# Client-only, deliberately -- and this is the one mod whose side disagrees with
# Modrinth, which marks server_side = required. Modrinth is describing what e4mc
# CAN do (tunnel a dedicated server), not what this pack needs. Our server has a
# real public address, so a tunnel is pointless there; e4mc is here so players can
# share their own singleplayer worlds while the pack is installed.
#
# It works client-side despite e4mc.mixins.json listing 8 non-client mixins
# (ServerConnectionListenerMixin, ServerLoginPacketListenerImplMixin, the ban/
# whitelist/pardon command mixins): those target integrated-server classes, which
# exist on a client because the client embeds a server for singleplayer. Nothing
# in the pack declares a dependency on e4mc, so its absence server-side is inert.
#
# Do not "correct" this to both on the strength of the Modrinth listing.
side = "client"

