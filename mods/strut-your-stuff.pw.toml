name = "Strut Your Stuff (Struts)"
filename = "struts-1.3.0.jar"
# Both sides. "Extracted girder strut library" -- the shared strut/girder code
# Create: Bits 'n' Bobs 2.2.9 requires (struts [1.0.0,)). Its mixin config is
# required = false and gated behind com.cake.struts.foundation.StrutsCompatMixinPlugin,
# so the two Create compat entries only apply when Create is present.
#
# The manifest asks only for neoforge [21.1,). It jarjars
# sable-companion-common-1.21.1-1.5.0 with range [1.5.0,) -- no conflict with the
# pack's Sable 2.0.3, which jarjars 1.6.0 of the same artifact. NeoForge resolves
# to the higher version and it satisfies both ranges.
side = "both"

