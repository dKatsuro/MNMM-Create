name = "Create: DDCL"
filename = "ddcl-1.21.1-1.0.3.jar"
# Both sides. Registers dimmable variants of Create: Deco's cage lamps (andesite,
# brass, copper, industrial iron, iron, zinc, gold and netherite, each in red,
# blue, green and yellow), so the server needs the registry entries. Light level
# tracks redstone power, which is server-side state.
#
# create [6.0.7,) -- an OPEN upper bound, unlike the 30 mods in this pack that
# cap Create at [6.0.x,6.1.0). This one adds no new Create ceiling. createdeco
# [2.1.0,) is met by our 2.1.3, and neoforge [21.1.219,) by our 21.1.249.
#
# Modrinth links this version against Create 6.0.7 specifically, but that is only
# Modrinth's recommended-version pointer -- the jar manifest is open-ended.
# No nested jars.
side = "both"

