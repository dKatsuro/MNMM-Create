name = "Create Cobblestone"
filename = "createcobblestone-1.4.12+neoforge-1.21.1-144.jar"
# Both sides: every manifest dependency is side = "BOTH", Modrinth lists both as
# required, and the generator block runs its SU consumption and item output
# server-side while the client needs the block and its renderer.
#
# neoforge [21,) -- we are on 21.1.233.
# minecraft [1.21.1] -- a single exact version, so any MC bump hard-fails this.
# create [6.0.0,6.1) -- EXCLUSIVE upper bound. We ship Create 6.0.10, so a bump
# to Create 6.1 breaks this mod; check for an update before bumping Create.
#
# Overlaps with Create: Easy Stone Generators, which we already ship, but the
# angle is different: this is a single SU-powered block priced in stress
# (1 cobble/tick = 64 SU at 8 rpm), specifically so contraptions do not need a
# lava/water cobble generator eating the frame.
side = "both"

