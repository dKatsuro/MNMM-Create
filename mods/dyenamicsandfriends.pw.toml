name = "Dyenamics and Friends"
filename = "dyenamicsandfriends-1.21.1-2.2.2.jar"
# Both sides. The compatibility layer for Dyenamics -- coloured variants of other
# mods' blocks in the 18 Dyenamics colours.
#
# The important structural point, and the reason this pairing replaced Dye Depot
# and Dye The World: all 1953 of its blockstates are registered under its OWN
# dyenamicsandfriends namespace. It injects nothing into other mods' namespaces
# and never touches DyeColor, so it cannot produce the model-less blocks that
# Dye Depot's enum extension did.
#
# Create support is done with tags rather than registration --
# data/create/tags/{block,item}/seats.json, valve_handles.json and
# windmill_sails.json -- so its coloured seats, valve handles and windmill sails
# are picked up as genuine Create blocks. That is more working Create coverage
# than the Dye Depot route ever delivered, with no missing models.
#
# Also ships data for comforts, supplementaries, farmersdelight, quark,
# botanypots, chalk, elevatorid, cookingforblockheads and sleep_tight among
# others; assets for another_furniture, productivemetalworks and vanilla.
#
# dyenamics [1.21.1-3.3.1,) -- we ship 3.4.2 -- plus neoforge [21.1.0,) (declared
# twice; harmless) and minecraft [1.21.1,1.22). productivemetalworks and luminax
# are both OPTIONAL and neither is in this pack, so those paths stay dormant.
#
# CurseForge-only; the Modrinth project of the same name is Forge 1.18.2 and has
# no 1.21.1 build.
side = "both"

