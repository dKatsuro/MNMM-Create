name = "Lootr"
filename = "lootr-neoforge-1.21.1-1.11.38.124.jar"
# Both sides, and it has to be. Lootr swaps vanilla loot containers for its own
# blocks and block entities that roll a separate inventory per player; that state
# and its rolling live on the server (lootr/common/api, lootr/neoforge/network),
# while the client needs the block/item registrations, renderers and packet
# handlers to draw and open them. A client without the jar cannot open a Lootr
# chest at all.
#
# neoforge [21.1.195,) and minecraft 1.21.1; we are on 21.1.234. Three mixin
# configs, one of which (lootr-neoforge-digsite_workshop.mixins.json) is gated by
# requiredMods = ["digsite_workshop"] and stays inert -- that mod is not here.
side = "both"

