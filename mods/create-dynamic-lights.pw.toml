name = "Create: Dynamic Lights"
filename = "create-dyn-light-forge-1.21.1-2.0.1.jar"
# Both sides. Two independent features, and only one of them is clientside:
#   1. Light blocks placed as contraptions move -- LightMovementBehaviour calls
#      Level.setBlock and is gated by a genuine server config
#      (CreateDynLightServer: enableLightBlock, lightBlockEmissionLowerLimit).
#      This half needs the mod on the server.
#   2. Feeding contraption light sources to a dynamic-lights renderer -- client
#      only, and see the backend warning below.
#
# The Modrinth description advertises "Support LambDynamicLights", but that is
# only true of the Fabric build. This NeoForge jar contains zero dev/lambdaurora
# references; the class named LambDynLightsDelegate is a leftover from the
# Fabric source, and every type it actually binds is toni/sodiumdynamiclights/*
# -- CreateDynLightSourceForge implements
# toni.sodiumdynamiclights.DynamicLightSource. LambdAurora's LambDynamicLights
# ships nothing under that package, so it cannot serve as the backend here.
# Sodium Dynamic Lights is the only option and is installed alongside.
#
# The sodiumdynamiclights dependency is mandatory = false in the manifest
# (Modrinth's page wrongly labels it required), but there is no ModList.isLoaded
# guard anywhere in the jar, so running without Sodium Dynamic Lights while the
# client config enableLambDynamicLight is on is a NoClassDefFoundError path.
# Keep the two together.
#
# create [6.0.0,) and neoforge [21.1.129,); we are on 6.0.10 / 21.1.234.
# Published as beta -- 2.0.1 is the current 1.21.1 build. Ships no mixins.
side = "both"

