name = "Trash Cans"
filename = "trashcans-1.0.18c-neoforge-mc1.21.jar"
# Both sides: every manifest dependency is side = "BOTH", and voiding items,
# fluids or energy is a server-side world operation. The filter GUI is the only
# client-facing part.
#
# Four blocks -- item, liquid, energy and ultimate trash cans -- each with a
# whitelist/blacklist filter. They act as insert-only endpoints for pipes and
# conduits (the 1.0.18b changelog is specifically a pipe-connection fix), so
# they can terminate a Create fluid or item line directly.
#
# Both required libs were already in the pack, so this pulled in nothing new:
#   supermartijn642corelib   [1.1.17,1.2.0)  -- we ship 1.1.21. The upper bound
#                                               is exclusive, so bumping Core Lib
#                                               to 1.2 will hard-fail this mod.
#   supermartijn642configlib [1.1.6,)        -- we ship 1.1.8.
#
# neoforge [21.0.78-beta,) and minecraft [1.21,1.21.2); we are on 21.1.234 / 1.21.1.
#
# Licensed "All rights reserved" in the manifest -- fine to ship via packwiz,
# which links to the author's own Modrinth CDN rather than redistributing.
side = "both"

