name = "GUI Retextures"
filename = "GUIRetextures-Dark-2.1.zip"
# Dark Mode variant, deliberately. Upstream publishes two builds of every
# release -- plain and "-darkmode" -- as separate Modrinth versions of the same
# project. `packwiz update` resolves to the newest by date, which is the PLAIN
# build, so a blind update silently swaps the pack to light GUIs. It did exactly
# that going 1.11-darkmode -> 2.1; re-pointed here at 2.1-darkmode.
# Check this file after any `packwiz update`.
side = "client"

